<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IMPACT-Scribe Quick Start</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --card: #ffffff;
      --text: #17212b;
      --muted: #5b6470;
      --line: #d7dce2;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.55 "Segoe UI", Arial, sans-serif;
    }
    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 28px 40px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 30px;
      line-height: 1.2;
    }
    p {
      margin: 0;
      color: var(--muted);
    }
    .shot {
      margin-top: 22px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card);
      box-shadow: 0 8px 24px rgba(23, 33, 43, 0.06);
    }
    .shot img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      border: 1px solid #e8ebef;
      background: #fff;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>IMPACT-Scribe Quick Start</h1>
    <p>
      This version is image-first on purpose: each step is written directly on a real screenshot so the guide stays legible without juggling separate captions.
    </p>

    <div class="shot">
      <img src="assets/quick_start/step_01_open_help.png" alt="Step 1. Open the guide from the information icon">
    </div>

    <div class="shot">
      <img src="assets/quick_start/step_02_loaded_timeline.png" alt="Step 2. Start from a loaded timeline">
    </div>

    <div class="shot">
      <img src="assets/quick_start/step_03_draw_and_refine.png" alt="Step 3. Draw one uncertain scribble and refine the split">
    </div>

    <div class="shot">
      <img src="assets/quick_start/step_04_accept_and_cleanup.png" alt="Step 4. Accept the split and use right click to delete a stroke or marker">
    </div>
  </div>
</body>
</html>
